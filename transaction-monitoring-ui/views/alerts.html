<h3 class="mb-3">Alerts</h3>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Transaction ID</th>
        <th>Risk</th>
        <th>Status</th>
        <th>Created At</th>
    </tr>
    </thead>
    <tbody>
    <tr ng-repeat="a in alerts">
        <td>{{a.id}}</td>
        <td>{{a.transactionId}}</td>
        <td>{{a.riskScore}}</td>
        <td>{{a.status}}</td>
        <td>{{a.createdAt}}</td>
    </tr>
    </tbody>
</table>
